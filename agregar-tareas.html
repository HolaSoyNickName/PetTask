<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar Tarea - PetTask</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Questrial&display=swap"
        rel="stylesheet" />
    <!-- CSS -->
    <link rel="stylesheet" href="agregar-tareas.css" />
</head>

<body>
    <main class="contenido">
        <section class="tarjeta-formulario">
            <h1 class="titulo">Agregar Tarea</h1>

            <form>
                <div class="campo">
                    <label for="materia" class="form-label"> Materia </label>
                    <input type="text" id="materia" name="materia" class="form-control"
                        placeholder="Ingresa la materia" required />
                </div>

                <div class="campo">
                    <label for="tarea" class="form-label"> Tarea </label>
                    <input type="text" id="tarea" name="tarea" class="form-control"
                        placeholder="Ingresa el nombre de la tarea" required />
                </div>

                <div class="campo">
                    <label for="descripcion" class="form-label"> Descripción de tarea </label>
                    <textarea id="descripcion" name="descripcion" class="form-control"
                        placeholder="Escribe una descripción de la tarea"></textarea>
                </div>

                <div class="botones">
                    <button type="button" class="btn-cancelar"> Cancelar </button>
                    <button type="submit" class="btn-guardar"> Guardar tarea </button>
                </div>
            </form>
        </section>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
