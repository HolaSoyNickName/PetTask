<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetTask - Iniciar Sesión</title>
  </head>
  <body>
    <h1>Iniciar Sesión</h1>

    <form>
      <p>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="Usuario"
          required
        />
      </p>

      <p>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Contraseña"
          required
        />
      </p>

      <p>
        <button type="submit">Iniciar Sesión</button>
      </p>
      <p>¿No tienes una cuenta? <a href="#">Regístrarse</a></p>
    </form>
  </body>
</html>
