<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actualizar Tarea - PetTask</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Questrial&display=swap"
        rel="stylesheet" />
    <!-- CSS -->
    <link rel="stylesheet" href="../css/estilos.css" />
    <link rel="stylesheet" href="../css/actualizar-tarea.css" />
</head>
<body>
    <main class="contenido">
        <section class="tarjeta-formulario">
            <h1 class="titulo">Actualizar Tarea</h1>
            <p class="descripcion">Modifica los datos de la tarea seleccionada y guarda los cambios.</p>
            <div id="alerta" class="alerta d-none" role="alert">
                ¡Los cambios de la tarea se guardaron correctamente!
            </div>
            <form>
                <div class="campo">
                    <label for="id" class="form-label"> ID de la tarea </label>
                    <input type="text" class="form-control" id="id" placeholder="Ingresa el ID de la tarea" />
                </div>
                <div class="campo">
                    <label for="nombre" class="form-label"> Nombre de la tarea </label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ingresa el nombre de la tarea" />
                </div>
                <div class="campo">
                    <label for="descripcion" class="form-label"> Descripción </label>
                    <textarea class="form-control" id="descripcion"
                        placeholder="Escribe una descripción de la tarea"></textarea>
                </div>
                <div class="botones">
                    <button type="button" class="btn-cancelar"> Cancelar </button>
                    <button type="button" class="btn-guardar" data-bs-toggle="modal"
                        data-bs-target="#modalConfirmar">
                        Guardar cambios
                    </button>
                </div>
            </form>
        </section>
    </main>
    <script src="../js/app.js"></script>
    <footer class="site-footer">PetTask · Aplicaciones Web · 2026</footer>
</body>
</html>
