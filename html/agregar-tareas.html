<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar Tarea - PetTask</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Questrial&display=swap"
        rel="stylesheet" />
    <!-- CSS -->
    <link rel="stylesheet" href="../css/estilos.css" />
    <link rel="stylesheet" href="../css/agregar-tareas.css" />
</head>
<body>
    <!-- NAVBAR -->
    <header class="pet-nav navbar navbar-expand-md navbar-dark">
        <a class="pet-nav__brand" href="../index.html">
            <img src="../img/logoNav.png" alt="Logotipo de PetTask" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú de navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <nav class="pet-nav__links navbar-nav ms-lg-auto" aria-label="Navegación principal">
                <a href="../index.html">Inicio</a>
                <a href="../nosotros.html">Nosotros</a>
                <a href="../servicios.html">Servicios</a>
                <a href="../contacto.html">Contacto</a>
                <a class="pet-nav__login" href="iniciar-sesion.html">Iniciar sesión</a>
            </nav>
        </div>
    </header>
    <main class="contenido">
        <section class="card tarjeta-formulario">
            <h1 class="titulo">Agregar Tarea</h1>
            <form>
                <div class="campo">
                    <label for="materia" class="form-label"> Materia </label>
                    <input type="text" id="materia" name="materia" class="form-control"
                        placeholder="Ingresa la materia" required />
                </div>
                <div class="campo">
                    <label for="tarea" class="form-label"> Tarea </label>
                    <input type="text" id="tarea" name="tarea" class="form-control"
                        placeholder="Ingresa el nombre de la tarea" required />
                </div>
                <div class="campo">
                    <label for="descripcion" class="form-label"> Descripción de tarea </label>
                    <textarea id="descripcion" name="descripcion" class="form-control"
                        placeholder="Escribe una descripción de la tarea"></textarea>
                </div>
                <div class="botones">
                    <button type="button" class="btn-cancelar"> Cancelar </button>
                    <button type="submit" class="btn-guardar"> Guardar tarea </button>
                </div>
            </form>
        </section>
    </main>
    <footer class="site-footer">PetTask · Aplicaciones Web · 2026</footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
