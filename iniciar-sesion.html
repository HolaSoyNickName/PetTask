<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - PetTask</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Questrial&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="css/iniciar-sesion.css" />
</head>
<body>
    <main class="contenido">
        <section class="card tarjeta-login">
            <h1 class="titulo">Iniciar sesión</h1>
            <form id="formulario-login" novalidate autocomplete="on" aria-describedby="estado-login">
                <div class="campo">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" aria-describedby="error-usuario" placeholder="Ingresa tu usuario" required />
                    <div class="invalid-feedback" id="error-usuario">Escribe tu usuario.</div>
                </div>
                <div class="campo">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasena" name="contrasena" autocomplete="current-password" minlength="8" maxlength="1024" pattern="(?=.*[^A-Za-z0-9\s]).{8,}" aria-describedby="error-contrasena" placeholder="Tu contraseña" required />
                    <div class="invalid-feedback" id="error-contrasena">Usa al menos 8 caracteres y un símbolo especial (sin espacios).</div>
                </div>
                <div id="estado-login" class="visually-hidden" role="status" aria-live="polite"></div>
                <div class="boton">
                    <button type="submit" class="btn-entrar">Entrar</button>
                </div>
                <div class="enlaces-login">
                    <p>¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
                </div>
            </form>
        </section>
    </main>
    <footer class="site-footer">PetTask · Aplicaciones Web · 2026</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/iniciar-sesion.js"></script>
</body>
</html>
